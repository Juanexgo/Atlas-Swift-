name: Atlas
options:
  bundleIdPrefix: ai.atlas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Atlas
        excludes:
          - "Resources/Info.plist"
    resources:
      - Atlas/Resources/Assets.xcassets
    info:
      path: Atlas/Resources/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # Atlas-specific — override at archive time if you deploy the API
        ATLAS_API_URL: http://localhost:4001
        # Unlock ProMotion 120Hz on Pro/Pro Max iPhones
        CADisableMinimumFrameDurationOnPhone: true
        # Allow http://localhost connections during development
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.atlas.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: NO
